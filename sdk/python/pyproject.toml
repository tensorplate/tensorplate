[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorplate-python"
description = "First-party Python SDK for calling deployed TensorPlate detection and vision serving models."
version = "0.1.4.dev0"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
readme = "README.md"
authors = [{ name = "TensorPlate Contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The SDK core is dependency-free: the serving client's HTTP transport is
# hand-rolled over the standard library. numpy is an optional extra, used
# only for tensor array access; the vision helpers add their own extras.
dependencies = []

[project.optional-dependencies]
# Optional array access: ServingClient works without numpy; the tensor
# `.to_numpy()` / `.from_numpy()` helpers require it.
numpy = ["numpy>=1.22"]
# Vision helpers (preprocessing + detector postprocessing): array ops plus
# Pillow image decoding. The superset detection workflows install.
vision = ["numpy>=1.22", "pillow>=9.1"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/tensorplate/tensorplate"
Repository = "https://github.com/tensorplate/tensorplate"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tensorplate*"]

[tool.setuptools.package-data]
tensorplate = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PT",   # pytest style
    "RUF",  # ruff-native
    "ANN",  # annotations
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src", "tests"]

# numpy is an optional dependency, lazily imported for tensor array access.
# The dev/CI gate does not install it, so it is ignored when missing; the
# code also type-checks cleanly when numpy is present.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "PIL", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
