[package]
name = "tensorplate-agent"
description = "TensorPlate device agent: desired-state, deploy transactions, worker supervision."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "tensorplate_agent"
path = "src/lib.rs"

[[bin]]
name = "tensorplate-agent"
path = "src/main.rs"

[dependencies]
tensorplate-protocol = { workspace = true }
tensorplate-platform = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The config-schema contract test validates the packaged configs against
# `config/schemas/agent.json` itself, rather than checking key names.
jsonschema = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
