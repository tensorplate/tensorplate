name: APT Repository

# Republish/recovery for the signed APT repository at
# https://packages.tensorplate.com/apt.
#
# The primary APT publish runs inside release.yml's `publish-apt` job (gated
# by the protected `apt` environment) on the release tag. This workflow is the
# manual republish/recovery and staging path; it no longer auto-fires on a
# Release going public.
#
# Triggers:
#   - workflow_dispatch: republish an existing release's repository metadata
#     without rebuilding packages, or publish to a staging destination.
#     With source_run_id, publishes a build-only Release run's unsigned
#     asset artifact for pre-tag staging validation: signed with the
#     production key (so test hosts use the shipped bootstrap keyring
#     unchanged) and hard-restricted to non-production destinations.
#     Dispatch with --ref pointing at the maintenance branch being staged.
#
# The repository tree is built and signed by tools/release/publish-apt-repo.sh
# from the GitHub Release assets (checksum + cosign verified). This workflow
# owns only asset download and object-storage sync. Sync order is pool/ then
# dists/ so published metadata never references missing packages; cache
# policy is immutable for pool/ and short-lived for dists/.
#
# Trust model and validation: docs/release/apt-repository.md.
# Provisioning details live in the maintainer release-ops runbook.
# Required configuration:
#   vars.TP_APT_REPO_DEST        s3://bucket/prefix for the production repo
#   vars.TP_APT_AWS_REGION       optional, defaults to us-east-1
#   vars.TP_APT_S3_ENDPOINT      optional, for S3-compatible storage (R2, MinIO)
#   secrets.TP_APT_SIGNING_KEY   armored OpenPGP private archive signing key
#   secrets.TP_APT_SIGNING_KEY_PASSPHRASE  optional key passphrase
#   secrets.TP_APT_AWS_ACCESS_KEY_ID / TP_APT_AWS_SECRET_ACCESS_KEY

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to (re)publish, for example v0.1.2
        required: true
      dest:
        description: Destination override (s3://bucket/prefix), e.g. a staging bucket. Defaults to vars.TP_APT_REPO_DEST.
        required: false
        default: ''
      source_run_id:
        description: Pre-tag staging only — a successful build-only Release run ID whose unsigned asset artifact is published instead of GitHub Release assets. Requires dest, and refuses the production destination.
        required: false
        default: ''

permissions:
  contents: read
  # The pre-tag staging path downloads another workflow run's artifact
  # (actions/download-artifact with run-id), which needs actions: read.
  actions: read

concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  publish:
    name: build, sign, and sync apt repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ vars.TP_APT_REPO_DEST != '' || inputs.dest != '' }}
    env:
      TAG: ${{ inputs.tag }}
      DEST: ${{ inputs.dest != '' && inputs.dest || vars.TP_APT_REPO_DEST }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TP_APT_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TP_APT_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.TP_APT_AWS_REGION || 'us-east-1' }}
      # The endpoint may carry the storage account id. It is not a secret,
      # but public-repo workflow logs are public; defining it as a secret
      # instead of a variable gets it auto-masked in logs.
      TP_APT_S3_ENDPOINT: ${{ secrets.TP_APT_S3_ENDPOINT || vars.TP_APT_S3_ENDPOINT }}
      # Newer aws-cli versions send integrity checksums by default, which
      # some S3-compatible providers (notably Cloudflare R2) have not
      # always accepted. when_required is correct for AWS S3 too.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
      - name: Validate release tag
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PROD_DEST: ${{ vars.TP_APT_REPO_DEST }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::the stable APT channel only publishes final vX.Y.Z releases; got '$TAG'"
            exit 1
          fi
          # Build-run artifacts are unsigned (no cosign bundle), so they may
          # only ever reach a non-production destination.
          if [[ -n "$SOURCE_RUN_ID" ]]; then
            if [[ -z "$DEST" || "$DEST" == "$PROD_DEST" ]]; then
              echo "::error::source_run_id publishes pre-tag staging assets; it requires a dest override and refuses the production destination"
              exit 1
            fi
          fi

      # Checkout at the release tag so the publication script and the
      # bootstrap keyring match exactly what that release shipped.
      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Pre-tag staging publishes (source_run_id) have no tag ref yet;
          # they check out the ref the dispatch ran against (the maintenance
          # branch), which is the source the build-only run built.
          ref: ${{ inputs.source_run_id != '' && github.ref || env.TAG }}

      # A stalled mirror is what costs time here, not a failing one: apt
      # holds an open-but-idle connection and waits, so a job burns its
      # whole budget without ever failing. A response timeout turns the
      # stall into an error, and only then can a retry recover it —
      # retries alone do nothing for a hang. Written as a drop-in so it
      # also covers apt calls inside the test scripts, which per-command
      # flags would miss.
      - name: Make apt fail fast and retry
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-tensorplate-resilience >/dev/null
          apt-config dump | grep -E '^Acquire::(Retries|http::Timeout)' || {
            echo 'apt did not accept the resilience drop-in' >&2; exit 1; }

      - name: Install repository tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          tools/ci/apt-get.sh update
          tools/ci/apt-get.sh install -y --no-install-recommends \
            apt-utils \
            dpkg-dev \
            gnupg \
            gpgv

      - name: Install cosign
        shell: bash
        env:
          COSIGN_VERSION: v3.0.2
          COSIGN_LINUX_AMD64_SHA256: 46dbdcb5467a3dfec2526923d0b3365e40c8d9dc00ec23d5aca3437449e8cbfd
        run: |
          set -Eeuo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL \
            -o "$tmpdir/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          printf '%s  %s\n' "$COSIGN_LINUX_AMD64_SHA256" "$tmpdir/cosign" | sha256sum -c -
          sudo install -m 0755 "$tmpdir/cosign" /usr/local/bin/cosign
          cosign version

      - name: Download release assets
        if: ${{ inputs.source_run_id == '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/assets"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "${RUNNER_TEMP}/assets"
          ls -la "${RUNNER_TEMP}/assets"

      - name: Download build-only run assets (staging)
        if: ${{ inputs.source_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tensorplate-${{ env.TAG }}-release-assets-unsigned
          path: ${{ runner.temp }}/assets
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      # The canonical release verifier enforces the complete required
      # package/architecture set, per-file checksums, and the manifest
      # self-digest, so a partial asset download can never publish a
      # partial APT package set.
      - name: Verify release asset set
        shell: bash
        run: |
          set -Eeuo pipefail
          tools/release/tensorplate-release.sh verify \
            --skip-tag-verify \
            --version "${TAG#v}" \
            --tag "$TAG" \
            --artifacts-dir "${RUNNER_TEMP}/assets" \
            --manifest "${RUNNER_TEMP}/assets/tensorplate-${TAG}-artifacts.json" \
            --checksums "${RUNNER_TEMP}/assets/SHA256SUMS"

      - name: Stage signing key
        shell: bash
        env:
          TP_APT_SIGNING_KEY: ${{ secrets.TP_APT_SIGNING_KEY }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$TP_APT_SIGNING_KEY" ]]; then
            echo "::error::secrets.TP_APT_SIGNING_KEY is not configured; provision the archive signing key per the maintainer release-ops runbook"
            exit 1
          fi
          install -m 0600 /dev/null "${RUNNER_TEMP}/apt-signing-key.asc"
          printf '%s\n' "$TP_APT_SIGNING_KEY" > "${RUNNER_TEMP}/apt-signing-key.asc"

      - name: Sync down existing pool
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint_args=()
          [[ -n "$TP_APT_S3_ENDPOINT" ]] && endpoint_args+=(--endpoint-url "$TP_APT_S3_ENDPOINT")
          mkdir -p "${RUNNER_TEMP}/pool-existing"
          # An empty first-publish prefix syncs as an empty source; real
          # storage, endpoint, or credential failures must stop publication so
          # older packages are not silently dropped from generated metadata.
          aws s3 sync "${DEST}/pool" "${RUNNER_TEMP}/pool-existing" "${endpoint_args[@]}"
          find "${RUNNER_TEMP}/pool-existing" -type f -name '*.deb' | wc -l

      - name: Build and sign repository tree
        shell: bash
        env:
          TP_APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.TP_APT_SIGNING_KEY_PASSPHRASE }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -Eeuo pipefail
          # Build-only artifacts carry no cosign bundle; the tag-validation
          # step already pinned this mode to a non-production destination.
          asset_trust_args=(--cosign-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}")
          if [[ -n "$SOURCE_RUN_ID" ]]; then
            asset_trust_args=(--allow-unverified-assets)
          fi
          tools/release/publish-apt-repo.sh \
            --assets-dir "${RUNNER_TEMP}/assets" \
            --output "${RUNNER_TEMP}/apt-repo" \
            --existing-pool "${RUNNER_TEMP}/pool-existing" \
            --signing-key "${RUNNER_TEMP}/apt-signing-key.asc" \
            "${asset_trust_args[@]}"

      - name: Sync repository to object storage
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint_args=()
          [[ -n "$TP_APT_S3_ENDPOINT" ]] && endpoint_args+=(--endpoint-url "$TP_APT_S3_ENDPOINT")
          # pool/ first and immutable: package files never change contents
          # (the publish script enforces that), so they can be cached hard.
          aws s3 sync "${RUNNER_TEMP}/apt-repo/pool" "${DEST}/pool" \
            --cache-control "public, max-age=31536000, immutable" \
            "${endpoint_args[@]}"
          # dists/ second and short-lived so `apt update` sees new releases
          # quickly without CDN invalidation. --delete drops stale metadata.
          aws s3 sync "${RUNNER_TEMP}/apt-repo/dists" "${DEST}/dists" \
            --cache-control "public, max-age=60" \
            --delete \
            "${endpoint_args[@]}"

      - name: Publication summary
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "APT repository for ${TAG} synced to ${DEST}."
            echo "Validate from a clean host: install tensorplate-apt-source, then 'sudo apt update' must succeed without trust warnings."
          } >>"$GITHUB_STEP_SUMMARY"
