name: C++

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: cpp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: Ninja
  # No vcpkg binary cache: the build legs carry the installed tree between
  # runs, and vcpkg no longer has a GitHub Actions cache backend.
  VCPKG_BINARY_SOURCES: clear

jobs:
  build-test:
    name: build + T1 (${{ matrix.preset }})
    runs-on: ubuntu-22.04
    # A cold streaming dependency build includes gRPC, protobuf and OpenSSL.
    timeout-minutes: 120
    env:
      # Read by the dependency cache key as well as by Configure, so a
      # change to what vcpkg builds, or builds with, opens a new key.
      CC: clang
      CXX: clang++
      TP_VCPKG_TRIPLET: x64-linux
      TP_VCPKG_FEATURES: streaming-grpc
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: relwithdebinfo
            build_type: RelWithDebInfo
            sanitizers: 'OFF'
            tsan: 'OFF'
          - preset: asan-ubsan
            build_type: Debug
            sanitizers: 'ON'
            tsan: 'OFF'
          # ThreadSanitizer cannot share a build with ASan, so it is its own leg.
          - preset: tsan
            build_type: Debug
            sanitizers: 'OFF'
            tsan: 'ON'
    steps:
      - uses: actions/checkout@v4

      # A stalled mirror is what costs time here, not a failing one: apt
      # holds an open-but-idle connection and waits, so a job burns its
      # whole budget without ever failing. A response timeout turns the
      # stall into an error, and only then can a retry recover it —
      # retries alone do nothing for a hang. Written as a drop-in so it
      # also covers apt calls inside the test scripts, which per-command
      # flags would miss.
      - name: Make apt fail fast and retry
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-tensorplate-resilience >/dev/null
          apt-config dump | grep -E '^Acquire::(Retries|http::Timeout)' || {
            echo 'apt did not accept the resilience drop-in' >&2; exit 1; }

      - name: Install build tools
        run: |
          tools/ci/apt-get.sh update
          tools/ci/apt-get.sh install -y --no-install-recommends \
            ninja-build \
            clang-15 \
            llvm-15 \
            ca-certificates
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-15 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-15 100

      # vcpkg rebuilds a package when a part of its checkout the port names,
      # a compiler binary or the cmake it runs changes, and each runner image
      # brings another checkout. A key that names none of them still matches
      # exactly, and a tree restored on an exact match is not saved again.
      # vcpkg runs the image's cmake only once that is new enough for it.
      - name: Identify what builds the dependency packages
        id: toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          vcpkg_commit="$(git -C "$VCPKG_INSTALLATION_ROOT" rev-parse HEAD)"
          c_compiler="$(sha256sum "$(readlink -f "$(command -v "$CC")")")"
          cxx_compiler="$(sha256sum "$(readlink -f "$(command -v "$CXX")")")"
          cmake_version="$(cmake --version)"
          inputs="$(printf 'vcpkg %s\n%s %s\n%s %s\n%s\n' "$vcpkg_commit" \
            "$CC" "${c_compiler%% *}" "$CXX" "${cxx_compiler%% *}" \
            "${cmake_version%%$'\n'*}")"
          printf '%s\n' "$inputs"
          digest="$(printf '%s\n' "$inputs" | sha256sum)"
          echo "digest=${digest%% *}" >>"$GITHUB_OUTPUT"

      # One tree for the three legs: none of what differs between them
      # reaches vcpkg. The prefixes bring back the newest earlier tree, and
      # vcpkg keeps every package in it that is still the same.
      - name: Restore the vcpkg installed tree
        id: vcpkg-tree
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-tree-${{ env.TP_VCPKG_TRIPLET }}-${{ env.TP_VCPKG_FEATURES }}-${{ steps.toolchain.outputs.digest }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-tree-${{ env.TP_VCPKG_TRIPLET }}-${{ env.TP_VCPKG_FEATURES }}-${{ steps.toolchain.outputs.digest }}-
            vcpkg-tree-${{ env.TP_VCPKG_TRIPLET }}-${{ env.TP_VCPKG_FEATURES }}-

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python sidecar backend
        run: |
          python -m pip install --upgrade pip
          pip install -e backends/python_pytorch

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DTP_WARNINGS_AS_ERRORS=ON \
            -DTP_ENABLE_SANITIZERS=${{ matrix.sanitizers }} \
            -DTP_ENABLE_TSAN=${{ matrix.tsan }} \
            -DTP_ENABLE_STREAMING_GRPC=ON \
            -DVCPKG_MANIFEST_FEATURES="$TP_VCPKG_FEATURES" \
            -DVCPKG_TARGET_TRIPLET="$TP_VCPKG_TRIPLET" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$PWD/cmake/toolchains/x86_64-linux-gnu.cmake"

      # Here, not at the end of the job: a failing test must not cost the
      # next run an hour of gRPC.
      - name: Save the vcpkg installed tree
        if: steps.vcpkg-tree.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/build/vcpkg_installed
          key: ${{ steps.vcpkg-tree.outputs.cache-primary-key }}

      - name: Build
        run: cmake --build build --parallel

      - name: T1 unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure -L T1

      - name: T2 integration tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
          TP_TEST_PYTHON: python
        run: ctest --test-dir build --output-on-failure -L T2

      - name: T3 contract tests
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
          TP_TEST_PYTHON: python
        run: ctest --test-dir build --output-on-failure -L T3

  adapter-shells:
    name: adapter shells (no SDK)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # A stalled mirror is what costs time here, not a failing one: apt
      # holds an open-but-idle connection and waits, so a job burns its
      # whole budget without ever failing. A response timeout turns the
      # stall into an error, and only then can a retry recover it —
      # retries alone do nothing for a hang. Written as a drop-in so it
      # also covers apt calls inside the test scripts, which per-command
      # flags would miss.
      - name: Make apt fail fast and retry
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-tensorplate-resilience >/dev/null
          apt-config dump | grep -E '^Acquire::(Retries|http::Timeout)' || {
            echo 'apt did not accept the resilience drop-in' >&2; exit 1; }

      - name: Install build tools
        run: |
          tools/ci/apt-get.sh update
          tools/ci/apt-get.sh install -y --no-install-recommends \
            ninja-build \
            clang-15 \
            llvm-15 \
            ca-certificates
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-15 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-15 100

      - name: Configure adapter shells
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTP_WARNINGS_AS_ERRORS=ON \
            -DTP_ENABLE_SANITIZERS=OFF \
            -DTP_ENABLE_TENSORRT=ON \
            -DTP_ENABLE_LIBTORCH=ON \
            -DTP_ENABLE_STREAMING_GRPC=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$PWD/cmake/toolchains/x86_64-linux-gnu.cmake"

      - name: Build adapter shells
        run: cmake --build build --parallel

      - name: T1 adapter-shell unit tests
        run: ctest --test-dir build --output-on-failure -L T1

      - name: Streaming missing-feature refusal and unary serving
        run: |
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R 'ServingConfig.StreamingRequiresCompiledFeature|ServingConfig.StreamingDisabledByDefault'
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R '^WorkerVersion\.ReportsStreamingSupport$'
          ctest --test-dir build --output-on-failure --no-tests=error \
            -R '^ServingE2E\.(HealthRouteReportsReady|InferRouteHappyPath|PolicyInferAndResult)$'

  format:
    name: clang-format
    runs-on: ubuntu-22.04
    # Budgeted for the retrying apt wrapper's worst case (~19 min of bounded
    # attempts across two calls), not for the ~2 min this job actually takes.
    # At 10 a job that was recovering got cut off mid-retry.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # A stalled mirror is what costs time here, not a failing one: apt
      # holds an open-but-idle connection and waits, so a job burns its
      # whole budget without ever failing. A response timeout turns the
      # stall into an error, and only then can a retry recover it —
      # retries alone do nothing for a hang. Written as a drop-in so it
      # also covers apt calls inside the test scripts, which per-command
      # flags would miss.
      - name: Make apt fail fast and retry
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-tensorplate-resilience >/dev/null
          apt-config dump | grep -E '^Acquire::(Retries|http::Timeout)' || {
            echo 'apt did not accept the resilience drop-in' >&2; exit 1; }

      - name: Install clang-format
        run: |
          tools/ci/apt-get.sh update
          tools/ci/apt-get.sh install -y --no-install-recommends clang-format-15
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-15 100
      - name: Check formatting
        shell: bash
        run: |
          mapfile -t files < <(
            git ls-files include runtime serving_worker test \
              | grep -E '\.(cpp|cc|cxx|hpp|hh|h)$' || true
          )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No C++ files to format-check."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          clang-format --dry-run -Werror "${files[@]}"

  tidy:
    name: clang-tidy
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # A stalled mirror is what costs time here, not a failing one: apt
      # holds an open-but-idle connection and waits, so a job burns its
      # whole budget without ever failing. A response timeout turns the
      # stall into an error, and only then can a retry recover it —
      # retries alone do nothing for a hang. Written as a drop-in so it
      # also covers apt calls inside the test scripts, which per-command
      # flags would miss.
      - name: Make apt fail fast and retry
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-tensorplate-resilience >/dev/null
          apt-config dump | grep -E '^Acquire::(Retries|http::Timeout)' || {
            echo 'apt did not accept the resilience drop-in' >&2; exit 1; }

      - name: Install build tools
        run: |
          tools/ci/apt-get.sh update
          tools/ci/apt-get.sh install -y --no-install-recommends \
            ninja-build \
            clang-15 \
            clang-tidy-15
          sudo update-alternatives --install /usr/bin/clang      clang      /usr/bin/clang-15      100
          sudo update-alternatives --install /usr/bin/clang++    clang++    /usr/bin/clang++-15    100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-15 100

      - name: Configure (export compile_commands.json)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$PWD/cmake/toolchains/x86_64-linux-gnu.cmake"

      - name: Run clang-tidy
        shell: bash
        run: |
          mapfile -t files < <(
            git ls-files runtime serving_worker | grep -E '\.cpp$' || true
          )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No C++ source files for clang-tidy."
            exit 0
          fi
          printf '%s\n' "${files[@]}"
          clang-tidy --quiet -p build --warnings-as-errors='*' "${files[@]}"
