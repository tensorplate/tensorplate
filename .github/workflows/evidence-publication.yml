name: Evidence publication

# Committed lifecycle evidence is published in a public repository, so
# every change is scanned for host, account, cloud, device and network
# identifiers before it can merge. The release evidence gate cannot do
# this: it runs only on final tags, long after a commit is public.
#
# Deliberately not path-filtered. An evidence-only pull request touches
# nothing but docs/, which no other workflow's filter includes, and a
# scanner change must be tested by the same job that runs it.
#
# This pass is patterns only. The operator's own host, account, project
# and instance names live in a private literal file that never reaches
# CI, so filing evidence still means running the scanner locally with
# --literals first (docs/validation/evidence/v0.2.1/README.md).
#
# The public hygiene job scans everything else a pull request publishes:
# every file it adds or changes, at every commit, its commit messages and
# authors, and its title, body and branch name, since squash-merge makes
# the body a commit message. It runs again when the title or body is
# edited. The same script is the pre-push check (rule 10 of
# docs/validation/fixture-and-evidence-rules.md).

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: evidence publication scan
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Shellcheck the scanner and its test
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
            shellcheck tools/validation/check-evidence-publication.sh \
              test/validation/evidence_publication_test.sh
          else
            echo '::warning::shellcheck is not installed on this runner; lint skipped'
          fi

      - name: Scanner tests
        shell: bash
        run: test/validation/evidence_publication_test.sh

      - name: Scan committed evidence
        shell: bash
        run: tools/validation/check-evidence-publication.sh --patterns-only docs/validation/evidence

  public-hygiene:
    name: public hygiene scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      # The pull request's own commits, not the merge result: the range
      # scanned is exactly what the branch published.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Shellcheck the scanner and its test
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
            shellcheck tools/validation/check-public-hygiene.sh \
              test/validation/public_hygiene_test.sh
          else
            echo '::warning::shellcheck is not installed on this runner; lint skipped'
          fi

      - name: Scanner tests
        shell: bash
        run: test/validation/public_hygiene_test.sh

      # The pull request's text is read from the event payload file. It
      # never appears in an expression in a shell line, where it would be
      # code, or in a step's env block, which the log prints verbatim and
      # which would copy a disclosure into a log that outlives an edit.
      - name: Scan the pull request
        shell: bash
        run: |
          set -Eeuo pipefail
          text="${RUNNER_TEMP}/pull-request"
          mkdir -p "$text"
          python3 - "$GITHUB_EVENT_PATH" "$text" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              pull = json.load(handle)["pull_request"]
          for name, value in (("base.txt", pull["base"]["sha"]), ("title.txt", pull["title"]),
                              ("body.md", pull["body"] or ""), ("branch.txt", pull["head"]["ref"])):
              with open(os.path.join(sys.argv[2], name), "w", encoding="utf-8") as out:
                  out.write(value + "\n")
          PY
          tools/validation/check-public-hygiene.sh --base "$(cat "${text}/base.txt")" \
            --message "${text}/title.txt" \
            --message "${text}/body.md" \
            --message "${text}/branch.txt"
