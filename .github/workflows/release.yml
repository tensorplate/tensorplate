name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Annotated release tag to publish, for example v0.1.0 or v0.1.0-rc.1'
        required: true
        type: string
      publish:
        description: 'Create the GitHub Release after building assets. Set false for build-only validation.'
        required: false
        default: true
        type: boolean
      source_ref:
        description: 'Optional source ref for build-only validation, for example release/v0.1.0. Publish mode always uses the tag.'
        required: false
        type: string

# Permissions are scoped to the single release job below rather than granted
# workflow-wide. The job needs:
#   contents: write     -> create the GitHub Release and upload assets
#   id-token: write     -> keyless cosign signing + provenance OIDC
#   attestations: write -> publish the SLSA build-provenance attestation
permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: build packages + publish release assets
    runs-on:
      - self-hosted
      - linux
      - ARM64
      - tensorplate-release
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        # Untrusted-ish workflow_dispatch inputs are passed through env and
        # never interpolated directly into the script body, which would allow
        # shell injection. They are validated before use.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::release tags must be vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          version="${tag#v}"
          version="${version%%-*}"
          prerelease="false"
          if [[ "$tag" == *-* ]]; then
            prerelease="true"
          fi
          draft="false"
          if [[ "$prerelease" == "false" ]]; then
            draft="true"
          fi
          publish="true"
          checkout_ref="$tag"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            publish="$INPUT_PUBLISH"
            if [[ "$publish" != "true" && -n "$INPUT_SOURCE_REF" ]]; then
              checkout_ref="$INPUT_SOURCE_REF"
            fi
          fi
          if [[ "$publish" == "true" && ("$REF_TYPE" != "tag" || "$REF_NAME" != "$tag") ]]; then
            echo "::error::publish=true must run from the release tag ref $tag; use publish=false for branch build-only validation"
            exit 1
          fi
          release_dir="dist/release/${tag}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "draft=${draft}"
            echo "release_dir=${release_dir}"
            echo "manifest=${release_dir}/tensorplate-${tag}-artifacts.json"
            echo "checksums=${release_dir}/SHA256SUMS"
            echo "bundle=${release_dir}/SHA256SUMS.cosign.bundle"
            echo "notes=docs/release/notes/v${version}.md"
            echo "release_branch=release/v${version}"
            echo "publish=${publish}"
            echo "checkout_ref=${checkout_ref}"
          } >>"$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ steps.meta.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Verify annotated tag and release branch
        if: ${{ steps.meta.outputs.publish == 'true' }}
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_BRANCH: ${{ steps.meta.outputs.release_branch }}
        run: |
          set -Eeuo pipefail
          if [[ "$(git cat-file -t "$TAG" 2>/dev/null || true)" != "tag" ]]; then
            echo "::error::$TAG must be an annotated tag"
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$TAG")"
          git fetch origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/${RELEASE_BRANCH}"; then
            echo "::error::$TAG does not point at ${RELEASE_BRANCH}"
            exit 1
          fi

      - name: Install release build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            debhelper \
            dh-exec \
            dpkg-dev \
            git \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config \
            python3 \
            python3-pip \
            shellcheck
          command -v gh >/dev/null || {
            echo "::error::GitHub CLI (gh) must be installed on the release runner"
            exit 1
          }
          rustup show active-toolchain || rustup toolchain install

      - name: Build Debian packages and release manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_DIR: ${{ steps.meta.outputs.release_dir }}
          MANIFEST: ${{ steps.meta.outputs.manifest }}
          CHECKSUMS: ${{ steps.meta.outputs.checksums }}
          PUBLISH: ${{ steps.meta.outputs.publish }}
        run: |
          set -Eeuo pipefail
          args=(
            tools/release/build-release-artifacts.sh
            --version "$VERSION"
            --tag "$TAG"
            --artifacts-dir "$RELEASE_DIR"
            --manifest "$MANIFEST"
            --checksums "$CHECKSUMS"
            --arch arm64
          )
          if [[ "$PUBLISH" != "true" ]]; then
            args+=(--skip-tag-verify)
          fi
          "${args[@]}"

      - name: Install cosign
        if: ${{ steps.meta.outputs.publish == 'true' }}
        shell: bash
        env:
          COSIGN_VERSION: v3.0.2
          COSIGN_LINUX_AMD64_SHA256: 46dbdcb5467a3dfec2526923d0b3365e40c8d9dc00ec23d5aca3437449e8cbfd
          COSIGN_LINUX_ARM64_SHA256: 17fd784737ca54d7d8a343c82da6c5d6dbdee971e66644d923d1b057fb97d7ed
        run: |
          set -Eeuo pipefail
          case "$(uname -m)" in
            x86_64|amd64)
              asset="cosign-linux-amd64"
              expected="$COSIGN_LINUX_AMD64_SHA256"
              ;;
            aarch64|arm64)
              asset="cosign-linux-arm64"
              expected="$COSIGN_LINUX_ARM64_SHA256"
              ;;
            *)
              echo "::error::unsupported cosign bootstrap architecture: $(uname -m)"
              exit 1
              ;;
          esac
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL \
            -o "$tmpdir/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/${asset}"
          printf '%s  %s\n' "$expected" "$tmpdir/cosign" | sha256sum -c -
          chmod +x "$tmpdir/cosign"
          sudo install -m 0755 "$tmpdir/cosign" /usr/local/bin/cosign
          cosign version

      - name: Sign SHA256SUMS (keyless)
        if: ${{ steps.meta.outputs.publish == 'true' }}
        shell: bash
        env:
          CHECKSUMS: ${{ steps.meta.outputs.checksums }}
          BUNDLE: ${{ steps.meta.outputs.bundle }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -Eeuo pipefail
          # Keyless signature over the checksum manifest. The Sigstore bundle is
          # self-contained (signature + Fulcio certificate + Rekor inclusion
          # proof) and is published alongside SHA256SUMS so installers and users
          # can verify authenticity, not just integrity.
          cosign sign-blob --yes --bundle "$BUNDLE" "$CHECKSUMS"
          # Sanity check that the bundle verifies and binds to this workflow
          # identity on the exact release tag ref the installer will enforce.
          cosign verify-blob \
            --bundle "$BUNDLE" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$CHECKSUMS"

      - name: Attest build provenance
        if: ${{ steps.meta.outputs.publish == 'true' }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            ${{ steps.meta.outputs.release_dir }}/*.deb
            ${{ steps.meta.outputs.release_dir }}/install.sh
            ${{ steps.meta.outputs.manifest }}
            ${{ steps.meta.outputs.checksums }}

      - name: Upload unsigned release build artifact bundle
        if: ${{ steps.meta.outputs.publish != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tensorplate-${{ steps.meta.outputs.tag }}-release-assets
          path: |
            ${{ steps.meta.outputs.release_dir }}/*.deb
            ${{ steps.meta.outputs.release_dir }}/install.sh
            ${{ steps.meta.outputs.manifest }}
            ${{ steps.meta.outputs.checksums }}
          if-no-files-found: error

      - name: Upload signed release build artifact bundle
        if: ${{ steps.meta.outputs.publish == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tensorplate-${{ steps.meta.outputs.tag }}-release-assets
          path: |
            ${{ steps.meta.outputs.release_dir }}/*.deb
            ${{ steps.meta.outputs.release_dir }}/install.sh
            ${{ steps.meta.outputs.manifest }}
            ${{ steps.meta.outputs.checksums }}
            ${{ steps.meta.outputs.bundle }}
          if-no-files-found: error

      - name: Create GitHub Release with assets
        if: ${{ steps.meta.outputs.publish == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_DIR: ${{ steps.meta.outputs.release_dir }}
          NOTES: ${{ steps.meta.outputs.notes }}
          MANIFEST: ${{ steps.meta.outputs.manifest }}
          CHECKSUMS: ${{ steps.meta.outputs.checksums }}
          BUNDLE: ${{ steps.meta.outputs.bundle }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          DRAFT: ${{ steps.meta.outputs.draft }}
        run: |
          set -Eeuo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release $TAG already exists; refusing to replace published assets"
            exit 1
          fi

          shopt -s nullglob
          deb_assets=("${RELEASE_DIR}"/*.deb)
          ((${#deb_assets[@]} >= 6)) || {
            echo "::error::expected at least six .deb packages plus install.sh, manifest, and checksums"
            exit 1
          }
          installer="${RELEASE_DIR}/install.sh"
          [[ -f "$installer" ]] || {
            echo "::error::expected install.sh release asset"
            exit 1
          }
          [[ -f "$BUNDLE" ]] || {
            echo "::error::expected signed SHA256SUMS.cosign.bundle release asset"
            exit 1
          }
          assets=("${deb_assets[@]}" "$installer" "$MANIFEST" "$CHECKSUMS" "$BUNDLE")

          args=(release create "$TAG" "${assets[@]}" --verify-tag --title "TensorPlate ${TAG}" --notes-file "$NOTES")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          elif [[ "$DRAFT" != "true" ]]; then
            args+=(--latest)
          fi
          if [[ "$DRAFT" == "true" ]]; then
            args+=(--draft)
          fi

          gh "${args[@]}"

      - name: Build-only validation summary
        if: ${{ steps.meta.outputs.publish != 'true' }}
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -Eeuo pipefail
          {
            echo "Release asset build completed without creating a GitHub Release."
            echo "Download the workflow artifact named tensorplate-${TAG}-release-assets to test install.sh before publishing."
            echo "Build-only assets are unsigned; smoke-test the installer with --allow-unsigned. Signing and provenance run on the publish path (RC or final tag)."
          } >>"$GITHUB_STEP_SUMMARY"
