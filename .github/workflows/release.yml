name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Annotated release tag to publish, for example v0.1.0 or v0.1.0-rc.1'
        required: true
        type: string
      publish:
        description: 'Create the GitHub Release after building assets. Set false for build-only validation.'
        required: false
        default: true
        type: boolean
      source_ref:
        description: 'Optional source ref for build-only validation, for example release/0.1. Publish mode always uses the tag.'
        required: false
        type: string

# Permissions are scoped per job rather than granted workflow-wide. The
# Jetson job builds the ARM64 artifacts with TensorRT SDK access; the hosted
# publish job signs, attests, and creates the GitHub Release from GitHub's
# network path.
permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: resolve release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
      release_dir: ${{ steps.meta.outputs.release_dir }}
      manifest: ${{ steps.meta.outputs.manifest }}
      checksums: ${{ steps.meta.outputs.checksums }}
      bundle: ${{ steps.meta.outputs.bundle }}
      notes: ${{ steps.meta.outputs.notes }}
      release_branch: ${{ steps.meta.outputs.release_branch }}
      publish: ${{ steps.meta.outputs.publish }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}

    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        # Untrusted-ish workflow_dispatch inputs are passed through env and
        # never interpolated directly into the script body, which would allow
        # shell injection. They are validated before use.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::release tags must be vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          version="${tag#v}"
          version="${version%%-*}"
          prerelease="false"
          if [[ "$tag" == *-* ]]; then
            prerelease="true"
          fi
          draft="false"
          if [[ "$prerelease" == "false" ]]; then
            draft="true"
          fi
          publish="true"
          checkout_ref="$tag"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            publish="$INPUT_PUBLISH"
            if [[ "$publish" != "true" && -n "$INPUT_SOURCE_REF" ]]; then
              checkout_ref="$INPUT_SOURCE_REF"
            fi
          fi
          if [[ "$publish" == "true" && ("$REF_TYPE" != "tag" || "$REF_NAME" != "$tag") ]]; then
            echo "::error::publish=true must run from the release tag ref $tag; use publish=false for branch build-only validation"
            exit 1
          fi
          release_dir="dist/release/${tag}"
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "draft=${draft}"
            echo "release_dir=${release_dir}"
            echo "manifest=${release_dir}/tensorplate-${tag}-artifacts.json"
            echo "checksums=${release_dir}/SHA256SUMS"
            echo "bundle=${release_dir}/SHA256SUMS.cosign.bundle"
            echo "notes=docs/release/notes/v${version}.md"
            echo "release_branch=release/${version%.*}"
            echo "publish=${publish}"
            echo "checkout_ref=${checkout_ref}"
          } >>"$GITHUB_OUTPUT"

  build_cli_amd64:
    name: build amd64 CLI package
    needs: meta
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}

      - name: Install CLI package build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            debhelper \
            dh-exec \
            dpkg-dev \
            gnupg \
            pkg-config
          rustup show active-toolchain || rustup toolchain install

      - name: Build amd64 CLI binary
        shell: bash
        run: cargo build --release --bin tensorplate

      - name: Build tensorplate-cli amd64 package
        shell: bash
        run: |
          set -Eeuo pipefail
          # The cli-only build profile excludes the runtime services and the
          # Jetson metapackage, so a binary-arch build produces exactly the
          # workstation CLI package without the Jetson toolchain.
          DEB_BUILD_PROFILES=pkg.tensorplate.cli-only packaging/scripts/build-deb.sh -B
          mkdir -p dist/cli-amd64
          cp ../tensorplate-cli_*_amd64.deb dist/cli-amd64/
          dpkg-deb --info dist/cli-amd64/tensorplate-cli_*_amd64.deb

      - name: Upload amd64 CLI package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tensorplate-cli-amd64-deb
          path: dist/cli-amd64/*.deb
          if-no-files-found: error

  build_sdk_python:
    name: build tensorplate-python wheel + sdist
    needs: meta
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}

      - name: Build, check, and smoke-install the SDK distribution
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -Eeuo pipefail
          # The source tree carries a .dev0 development version between
          # releases; pin the built distribution to the release version.
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path("sdk/python/pyproject.toml")
          path.write_text(re.sub(r'(?m)^version = .*$', f'version = "{sys.argv[1]}"', path.read_text()))
          PY
          python3 -m venv .sdkbuild
          .sdkbuild/bin/pip install --upgrade pip build twine
          .sdkbuild/bin/python -m build sdk/python --outdir dist/sdk-python
          .sdkbuild/bin/python -m twine check dist/sdk-python/*
          # Dry-run gate: a clean environment installs the built wheel and imports it.
          python3 -m venv .sdkverify
          .sdkverify/bin/pip install dist/sdk-python/tensorplate_python-*.whl
          .sdkverify/bin/python -c "import tensorplate; print('clean import OK', tensorplate.__version__)"

      - name: Upload SDK distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tensorplate-python-dist
          path: dist/sdk-python/*
          if-no-files-found: error

  build_packages:
    name: build packages
    needs: [meta, build_cli_amd64, build_sdk_python]
    runs-on: [self-hosted, linux, ARM64, tensorplate-release]
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      tag: ${{ needs.meta.outputs.tag }}
      version: ${{ needs.meta.outputs.version }}
      prerelease: ${{ needs.meta.outputs.prerelease }}
      draft: ${{ needs.meta.outputs.draft }}
      release_dir: ${{ needs.meta.outputs.release_dir }}
      manifest: ${{ needs.meta.outputs.manifest }}
      checksums: ${{ needs.meta.outputs.checksums }}
      bundle: ${{ needs.meta.outputs.bundle }}
      notes: ${{ needs.meta.outputs.notes }}
      publish: ${{ needs.meta.outputs.publish }}
      checkout_ref: ${{ needs.meta.outputs.checkout_ref }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Verify annotated tag and release branch
        if: ${{ needs.meta.outputs.publish == 'true' }}
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          RELEASE_BRANCH: ${{ needs.meta.outputs.release_branch }}
        run: |
          set -Eeuo pipefail
          if [[ "$(git cat-file -t "$TAG" 2>/dev/null || true)" != "tag" ]]; then
            echo "::error::$TAG must be an annotated tag"
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$TAG")"
          git fetch origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/${RELEASE_BRANCH}"; then
            echo "::error::$TAG does not point at ${RELEASE_BRANCH}"
            exit 1
          fi

      - name: Install release build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            debhelper \
            dh-exec \
            dpkg-dev \
            git \
            gnupg \
            ninja-build \
            nlohmann-json3-dev \
            pkg-config \
            python3 \
            python3-pip \
            shellcheck
          command -v gh >/dev/null || {
            echo "::error::GitHub CLI (gh) must be installed on the release runner"
            exit 1
          }
          rustup show active-toolchain || rustup toolchain install

      - name: Stage amd64 CLI package next to build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tensorplate-cli-amd64-deb
          path: ${{ runner.temp }}/cli-amd64

      # build-release-artifacts.sh collects extra desktop CLI architectures
      # from the repository parent directory, the same place
      # dpkg-buildpackage drops the arm64 packages.
      - name: Move amd64 CLI package into release collection scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mv -f "${RUNNER_TEMP}/cli-amd64"/tensorplate-cli_*_amd64.deb ..
          ls ../tensorplate-cli_*_amd64.deb

      - name: Stage tensorplate-python SDK distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tensorplate-python-dist
          path: ${{ runner.temp }}/sdk-python

      - name: Build Debian packages and release manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          RELEASE_DIR: ${{ needs.meta.outputs.release_dir }}
          MANIFEST: ${{ needs.meta.outputs.manifest }}
          CHECKSUMS: ${{ needs.meta.outputs.checksums }}
          PUBLISH: ${{ needs.meta.outputs.publish }}
        run: |
          set -Eeuo pipefail
          args=(
            tools/release/build-release-artifacts.sh
            --version "$VERSION"
            --tag "$TAG"
            --artifacts-dir "$RELEASE_DIR"
            --manifest "$MANIFEST"
            --checksums "$CHECKSUMS"
            --arch arm64
            --sdk-dist-dir "${RUNNER_TEMP}/sdk-python"
          )
          if [[ "$PUBLISH" != "true" ]]; then
            args+=(--skip-tag-verify)
          fi
          "${args[@]}"

      - name: Upload unsigned release build artifact bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tensorplate-${{ needs.meta.outputs.tag }}-release-assets-unsigned
          path: ${{ needs.meta.outputs.release_dir }}/
          if-no-files-found: error

      - name: Build-only validation summary
        if: ${{ needs.meta.outputs.publish != 'true' }}
        shell: bash
        env:
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -Eeuo pipefail
          {
            echo "Release asset build completed without creating a GitHub Release."
            echo "Download the workflow artifact named tensorplate-${TAG}-release-assets-unsigned to test install.sh before publishing."
            echo "Build-only assets are unsigned; smoke-test the installer with --allow-unsigned. Signing and provenance run on the publish path (RC or final tag)."
          } >>"$GITHUB_STEP_SUMMARY"

  publish-release:
    name: sign, attest, and publish release assets
    needs: build_packages
    if: ${{ needs.build_packages.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.build_packages.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Download unsigned release build artifact bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tensorplate-${{ needs.build_packages.outputs.tag }}-release-assets-unsigned
          path: ${{ needs.build_packages.outputs.release_dir }}

      - name: Verify downloaded release assets
        shell: bash
        env:
          RELEASE_DIR: ${{ needs.build_packages.outputs.release_dir }}
          MANIFEST: ${{ needs.build_packages.outputs.manifest }}
          CHECKSUMS: ${{ needs.build_packages.outputs.checksums }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          deb_assets=("${RELEASE_DIR}"/*.deb)
          ((${#deb_assets[@]} >= 9)) || {
            echo "::error::expected at least nine .deb packages (runtime set, apt-source, metapackage, amd64 CLI) plus install.sh, manifest, and checksums"
            find "$RELEASE_DIR" -maxdepth 2 -type f -print
            exit 1
          }
          [[ -f "${RELEASE_DIR}/install.sh" ]] || {
            echo "::error::expected install.sh release asset"
            exit 1
          }
          [[ -f "$MANIFEST" ]] || {
            echo "::error::expected release manifest"
            exit 1
          }
          [[ -f "$CHECKSUMS" ]] || {
            echo "::error::expected SHA256SUMS"
            exit 1
          }
          (cd "$RELEASE_DIR" && sha256sum -c SHA256SUMS)

      - name: Install cosign
        shell: bash
        env:
          COSIGN_VERSION: v3.0.2
          COSIGN_LINUX_AMD64_SHA256: 46dbdcb5467a3dfec2526923d0b3365e40c8d9dc00ec23d5aca3437449e8cbfd
          COSIGN_LINUX_ARM64_SHA256: 17fd784737ca54d7d8a343c82da6c5d6dbdee971e66644d923d1b057fb97d7ed
        run: |
          set -Eeuo pipefail
          case "$(uname -m)" in
            x86_64|amd64)
              asset="cosign-linux-amd64"
              expected="$COSIGN_LINUX_AMD64_SHA256"
              ;;
            aarch64|arm64)
              asset="cosign-linux-arm64"
              expected="$COSIGN_LINUX_ARM64_SHA256"
              ;;
            *)
              echo "::error::unsupported cosign bootstrap architecture: $(uname -m)"
              exit 1
              ;;
          esac
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL \
            -o "$tmpdir/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/${asset}"
          printf '%s  %s\n' "$expected" "$tmpdir/cosign" | sha256sum -c -
          chmod +x "$tmpdir/cosign"
          sudo install -m 0755 "$tmpdir/cosign" /usr/local/bin/cosign
          cosign version

      - name: Sign SHA256SUMS (keyless)
        shell: bash
        env:
          CHECKSUMS: ${{ needs.build_packages.outputs.checksums }}
          BUNDLE: ${{ needs.build_packages.outputs.bundle }}
          TAG: ${{ needs.build_packages.outputs.tag }}
        run: |
          set -Eeuo pipefail
          # Keyless signature over the checksum manifest. The Sigstore bundle is
          # self-contained (signature + Fulcio certificate + Rekor inclusion
          # proof) and is published alongside SHA256SUMS so installers and users
          # can verify authenticity, not just integrity.
          cosign sign-blob --yes --bundle "$BUNDLE" "$CHECKSUMS"
          # Sanity check that the bundle verifies and binds to this workflow
          # identity on the exact release tag ref the installer will enforce.
          cosign verify-blob \
            --bundle "$BUNDLE" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$CHECKSUMS"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            ${{ needs.build_packages.outputs.release_dir }}/*.deb
            ${{ needs.build_packages.outputs.release_dir }}/install.sh
            ${{ needs.build_packages.outputs.release_dir }}/tensorplate_python-*.whl
            ${{ needs.build_packages.outputs.release_dir }}/tensorplate_python-*.tar.gz
            ${{ needs.build_packages.outputs.manifest }}
            ${{ needs.build_packages.outputs.checksums }}

      - name: Upload signed release build artifact bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tensorplate-${{ needs.build_packages.outputs.tag }}-release-assets
          path: |
            ${{ needs.build_packages.outputs.release_dir }}/*.deb
            ${{ needs.build_packages.outputs.release_dir }}/install.sh
            ${{ needs.build_packages.outputs.release_dir }}/tensorplate_python-*.whl
            ${{ needs.build_packages.outputs.release_dir }}/tensorplate_python-*.tar.gz
            ${{ needs.build_packages.outputs.manifest }}
            ${{ needs.build_packages.outputs.checksums }}
            ${{ needs.build_packages.outputs.bundle }}
          if-no-files-found: error

      - name: Create GitHub Release with assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build_packages.outputs.tag }}
          RELEASE_DIR: ${{ needs.build_packages.outputs.release_dir }}
          NOTES: ${{ needs.build_packages.outputs.notes }}
          MANIFEST: ${{ needs.build_packages.outputs.manifest }}
          CHECKSUMS: ${{ needs.build_packages.outputs.checksums }}
          BUNDLE: ${{ needs.build_packages.outputs.bundle }}
          PRERELEASE: ${{ needs.build_packages.outputs.prerelease }}
          DRAFT: ${{ needs.build_packages.outputs.draft }}
        run: |
          set -Eeuo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release $TAG already exists; refusing to replace published assets"
            exit 1
          fi

          shopt -s nullglob
          deb_assets=("${RELEASE_DIR}"/*.deb)
          ((${#deb_assets[@]} >= 9)) || {
            echo "::error::expected at least nine .deb packages (runtime set, apt-source, metapackage, amd64 CLI) plus install.sh, manifest, and checksums"
            exit 1
          }
          installer="${RELEASE_DIR}/install.sh"
          [[ -f "$installer" ]] || {
            echo "::error::expected install.sh release asset"
            exit 1
          }
          [[ -f "$BUNDLE" ]] || {
            echo "::error::expected signed SHA256SUMS.cosign.bundle release asset"
            exit 1
          }
          sdk_assets=("${RELEASE_DIR}"/tensorplate_python-*.whl "${RELEASE_DIR}"/tensorplate_python-*.tar.gz)
          ((${#sdk_assets[@]} == 2)) || {
            echo "::error::expected tensorplate-python wheel and sdist release assets"
            exit 1
          }
          assets=("${deb_assets[@]}" "$installer" "${sdk_assets[@]}" "$MANIFEST" "$CHECKSUMS" "$BUNDLE")

          args=(release create "$TAG" "${assets[@]}" --verify-tag --title "TensorPlate ${TAG}" --notes-file "$NOTES")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          elif [[ "$DRAFT" != "true" ]]; then
            args+=(--latest)
          fi
          if [[ "$DRAFT" == "true" ]]; then
            args+=(--draft)
          fi

          gh "${args[@]}"

  publish-pypi:
    name: publish tensorplate-python to PyPI
    needs: [meta, publish-release]
    # Publishes via PyPI Trusted Publishing (OIDC) through the protected
    # `pypi` environment. Gated: final releases only (release candidates never
    # publish to PyPI), and only when repository variable
    # PUBLISH_SDK_TO_PYPI=true. Requires the PyPI Trusted Publisher to be
    # configured for this repo + workflow + environment.
    if: ${{ needs.meta.outputs.publish == 'true' && needs.meta.outputs.prerelease == 'false' && vars.PUBLISH_SDK_TO_PYPI == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/tensorplate-python/${{ needs.meta.outputs.version }}/
    permissions:
      id-token: write  # OIDC for PyPI Trusted Publishing; no long-lived token stored

    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tensorplate-${{ needs.meta.outputs.tag }}-release-assets
          path: release-assets

      - name: Collect the signed SDK wheel + sdist
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p pypi-dist
          find release-assets -type f \( -name 'tensorplate_python-*.whl' -o -name 'tensorplate_python-*.tar.gz' \) -exec cp -t pypi-dist {} +
          ls -1 pypi-dist
          [[ "$(find pypi-dist -type f | wc -l)" -eq 2 ]] || {
            echo "::error::expected exactly the tensorplate-python wheel + sdist"
            exit 1
          }

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          packages-dir: pypi-dist
          # Trusted Publishing (OIDC) — configure the publisher on PyPI:
          #   project: tensorplate-python | owner/repo: ${{ github.repository }}
          #   workflow: release.yml | environment: pypi

  publish-apt:
    name: publish the APT repository
    needs: [meta, publish-release]
    # Builds, signs, and syncs the stable APT repository from this run's
    # signed assets (produced by publish-release), in parallel with the
    # other channels and behind the protected `apt` environment. This is
    # now the primary APT publish; apt-repo.yml is republish/recovery only.
    # Gated: final releases only, and only when the production destination
    # is configured (TP_APT_REPO_DEST). The `apt` environment must require a
    # reviewer (see docs/release/runbook.md external setup).
    if: ${{ needs.meta.outputs.publish == 'true' && needs.meta.outputs.prerelease == 'false' && vars.TP_APT_REPO_DEST != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: apt
      url: https://packages.tensorplate.com/apt
    permissions:
      # actions: read is deliberately omitted: the signed assets are
      # downloaded from THIS run (not cross-run), which does not require it.
      contents: read
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      DEST: ${{ vars.TP_APT_REPO_DEST }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TP_APT_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TP_APT_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.TP_APT_AWS_REGION || 'us-east-1' }}
      # The endpoint may carry the storage account id. Defining it as a
      # secret gets it auto-masked in this public repo's workflow logs.
      TP_APT_S3_ENDPOINT: ${{ secrets.TP_APT_S3_ENDPOINT || vars.TP_APT_S3_ENDPOINT }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
      # Checkout the release tag so the publication script and the bootstrap
      # keyring match exactly what this release shipped.
      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}

      - name: Install repository tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils \
            dpkg-dev \
            gnupg \
            gpgv

      - name: Install cosign
        shell: bash
        env:
          COSIGN_VERSION: v3.0.2
          COSIGN_LINUX_AMD64_SHA256: 46dbdcb5467a3dfec2526923d0b3365e40c8d9dc00ec23d5aca3437449e8cbfd
        run: |
          set -Eeuo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL \
            -o "$tmpdir/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          printf '%s  %s\n' "$COSIGN_LINUX_AMD64_SHA256" "$tmpdir/cosign" | sha256sum -c -
          sudo install -m 0755 "$tmpdir/cosign" /usr/local/bin/cosign
          cosign version

      # The signed release-assets bundle (the cosign-verified SHA256SUMS, the
      # manifest, the .deb set, install.sh, and the wheel/sdist) is produced
      # by publish-release in this same run, so APT publishes from the build
      # rather than re-downloading the not-yet-public GitHub Release.
      - name: Download signed release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tensorplate-${{ needs.meta.outputs.tag }}-release-assets
          path: ${{ runner.temp }}/assets

      - name: Resolve downloaded assets directory
        shell: bash
        run: |
          set -Eeuo pipefail
          # upload-artifact may preserve the release_dir prefix; locate the
          # directory that actually holds SHA256SUMS rather than assuming it.
          sums="$(find "${RUNNER_TEMP}/assets" -type f -name SHA256SUMS | head -n1)"
          [[ -n "$sums" ]] || {
            echo "::error::SHA256SUMS not found in the downloaded release-assets artifact"
            find "${RUNNER_TEMP}/assets" -maxdepth 3 -type f -print
            exit 1
          }
          echo "ASSETS_DIR=$(dirname "$sums")" >>"$GITHUB_ENV"

      # The canonical release verifier enforces the complete required
      # package/architecture set, per-file checksums, and the manifest
      # self-digest before anything is published.
      - name: Verify release asset set
        shell: bash
        run: |
          set -Eeuo pipefail
          tools/release/tensorplate-release.sh verify \
            --skip-tag-verify \
            --version "${TAG#v}" \
            --tag "$TAG" \
            --artifacts-dir "$ASSETS_DIR" \
            --manifest "${ASSETS_DIR}/tensorplate-${TAG}-artifacts.json" \
            --checksums "${ASSETS_DIR}/SHA256SUMS"

      - name: Stage signing key
        shell: bash
        env:
          TP_APT_SIGNING_KEY: ${{ secrets.TP_APT_SIGNING_KEY }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$TP_APT_SIGNING_KEY" ]]; then
            echo "::error::secrets.TP_APT_SIGNING_KEY is not configured; provision the archive signing key per the maintainer release-ops runbook"
            exit 1
          fi
          install -m 0600 /dev/null "${RUNNER_TEMP}/apt-signing-key.asc"
          printf '%s\n' "$TP_APT_SIGNING_KEY" > "${RUNNER_TEMP}/apt-signing-key.asc"

      - name: Sync down existing pool
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint_args=()
          [[ -n "$TP_APT_S3_ENDPOINT" ]] && endpoint_args+=(--endpoint-url "$TP_APT_S3_ENDPOINT")
          mkdir -p "${RUNNER_TEMP}/pool-existing"
          # An empty first-publish prefix syncs as an empty source; real
          # storage, endpoint, or credential failures must stop publication so
          # older packages are not silently dropped from generated metadata.
          aws s3 sync "${DEST}/pool" "${RUNNER_TEMP}/pool-existing" "${endpoint_args[@]}"
          find "${RUNNER_TEMP}/pool-existing" -type f -name '*.deb' | wc -l

      - name: Build and sign repository tree
        shell: bash
        env:
          TP_APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.TP_APT_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          # Release-path assets carry the cosign bundle; verification is
          # mandatory (no --allow-unverified-assets on this path).
          tools/release/publish-apt-repo.sh \
            --assets-dir "$ASSETS_DIR" \
            --output "${RUNNER_TEMP}/apt-repo" \
            --existing-pool "${RUNNER_TEMP}/pool-existing" \
            --signing-key "${RUNNER_TEMP}/apt-signing-key.asc" \
            --cosign-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"

      - name: Sync repository to object storage
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint_args=()
          [[ -n "$TP_APT_S3_ENDPOINT" ]] && endpoint_args+=(--endpoint-url "$TP_APT_S3_ENDPOINT")
          # pool/ first and immutable; dists/ second and short-lived so
          # `apt update` sees new releases without referencing missing files.
          aws s3 sync "${RUNNER_TEMP}/apt-repo/pool" "${DEST}/pool" \
            --cache-control "public, max-age=31536000, immutable" \
            "${endpoint_args[@]}"
          aws s3 sync "${RUNNER_TEMP}/apt-repo/dists" "${DEST}/dists" \
            --cache-control "public, max-age=60" \
            --delete \
            "${endpoint_args[@]}"

      - name: Publication summary
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo "APT repository for ${TAG} synced to ${DEST}."
            echo "Validate from a clean host: install tensorplate-apt-source, then 'sudo apt update' must succeed without trust warnings."
          } >>"$GITHUB_STEP_SUMMARY"

  publish-homebrew:
    name: publish the Homebrew formula bump
    needs: [meta, publish-release]
    # Opens (or updates) an auto-merge formula-bump PR in the Homebrew tap.
    # Completion means "PR opened with auto-merge armed", not "merged": the
    # tap's own CI (audit + build-from-source + `brew test` on Apple
    # Silicon) gates the actual merge, so go-live is eventually consistent.
    # Gated: final releases only, and only when PUBLISH_HOMEBREW_FORMULA is
    # set. The `homebrew` environment must require a reviewer.
    if: ${{ needs.meta.outputs.publish == 'true' && needs.meta.outputs.prerelease == 'false' && vars.PUBLISH_HOMEBREW_FORMULA == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: homebrew
      url: https://github.com/tensorplate/homebrew-tap
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.meta.outputs.checkout_ref }}

      - name: Open auto-merge formula-bump PR
        shell: bash
        # HOMEBREW_TAP_TOKEN is a fine-grained PAT or GitHub App token with
        # contents + pull_requests write scoped to the tap repo only.
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::secrets.HOMEBREW_TAP_TOKEN is not configured; provision a tap-scoped token per docs/release/runbook.md"
            exit 1
          fi
          tools/release/publish-homebrew-formula.sh \
            --tag "$TAG" \
            --source-repo "$SOURCE_REPO" \
            --tap-repo tensorplate/homebrew-tap

  publish-github:
    name: publish the GitHub Release
    needs: [meta, publish-release]
    # Un-drafts the GitHub Release created by publish-release, making the
    # attached assets public. This is its own approval-gated step now,
    # rather than the implicit trigger that used to start the APT publish.
    # The `github-release` environment must require a reviewer.
    if: ${{ needs.meta.outputs.publish == 'true' && needs.meta.outputs.prerelease == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.meta.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Un-draft the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::GitHub Release $TAG not found; publish-release must create the draft first"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
