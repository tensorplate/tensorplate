name: Supply chain

# License policy, dependency sources and known vulnerabilities for the Rust
# workspace (cargo-deny), a CycloneDX SBOM plus a vulnerability audit
# for each Python package and for the speech runtime lock (cyclonedx-py,
# pip-audit), and an SPDX SBOM plus a vulnerability scan of the serving
# worker's static native closure, read from the release configuration's
# vcpkg install tree (native-sbom.py, grype). Accepted
# vulnerabilities live in tools/release/vulnerability-dispositions.json;
# see docs/release/artifacts.md, "Supply-chain checks".
#
# No secrets and nothing paid: every job runs on a hosted runner with a
# read-only token. The weekly schedule is there because advisories are
# published without any change to this repository.

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # A prebuilt, checksum-pinned binary: cargo-deny 0.20.2 declares
  # rust-version 1.88 and edition 2024 on crates.io, and the workspace
  # toolchain is pinned to 1.78, so it cannot be built here from source.
  # The SHA-256 is the digest GitHub publishes for the release asset
  # cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
  # (GET /repos/EmbarkStudios/cargo-deny/releases, assets[].digest).
  CARGO_DENY_VERSION: '0.20.2'
  CARGO_DENY_SHA256: '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f'
  CYCLONEDX_BOM_VERSION: '7.4.0'
  PIP_AUDIT_VERSION: '2.10.1'
  # A prebuilt binary; the SHA-256 is the digest GitHub publishes for the
  # release asset grype_0.120.1_linux_amd64.tar.gz
  # (GET /repos/anchore/grype/releases, assets[].digest).
  GRYPE_VERSION: '0.120.1'
  GRYPE_SHA256: '0a9ee97ef5ae2ee953b0a80098105052e846cdbe319a57d808b519c33cd1343d'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_ROOT_USER_ACTION: ignore
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  dispositions:
    name: vulnerability dispositions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install release tooling requirements
        run: python -m pip install -r tools/release/requirements.txt

      - name: Disposition checker tests
        run: python test/release/test_vulnerability_dispositions.py

      - name: Native closure SBOM tool tests
        run: python test/release/test_native_sbom.py

      - name: Every disposition is current and agrees with deny.toml
        run: python tools/release/check-vulnerability-dispositions.py

  cargo-deny:
    name: cargo-deny (licenses, bans, sources, advisories)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # cargo-deny reads deny.toml's ignore list, which has no dates. This
      # job therefore checks the dispositions first, so an expired cargo
      # entry turns it red instead of quietly suppressing the advisory.
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Every disposition is current and agrees with deny.toml
        run: |
          python -m pip install --quiet -r tools/release/requirements.txt
          python tools/release/check-vulnerability-dispositions.py

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup show active-toolchain || rustup toolchain install
          cargo --version

      - name: Install cargo-deny ${{ env.CARGO_DENY_VERSION }}
        run: |
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${name}.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          printf '%s  %s\n' "${CARGO_DENY_SHA256}" "${RUNNER_TEMP}/${name}.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/${name}.tar.gz" -C "${RUNNER_TEMP}/bin" --strip-components=1 "${name}/cargo-deny"
          echo "${RUNNER_TEMP}/bin" >>"$GITHUB_PATH"

      - name: cargo deny check
        run: |
          cargo deny --version
          cargo deny --locked check advisories bans licenses sources

  python:
    name: SBOM and audit (${{ matrix.install }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: sdk/python
            install: ./sdk/python
            artifact: tensorplate-sdk-python
          # The extra detection workflows install: numpy and pillow.
          - package: sdk/python
            install: ./sdk/python[vision]
            artifact: tensorplate-sdk-python-vision
          # The streaming speech extra, installed from its hashed pins so
          # the audit covers the versions a pinned install gets.
          - package: sdk/python
            install: ./sdk/python[speech]
            pins: sdk/python/constraints/speech.txt
            artifact: tensorplate-sdk-python-speech
          - package: backends/python_pytorch
            install: ./backends/python_pytorch
            artifact: tensorplate-backend-python-pytorch
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the scanners in their own environment
        run: |
          python -m venv "${RUNNER_TEMP}/scanners"
          "${RUNNER_TEMP}/scanners/bin/python" -m pip install --quiet \
            "cyclonedx-bom==${CYCLONEDX_BOM_VERSION}" "pip-audit==${PIP_AUDIT_VERSION}"
          # Only the two scanners are pinned; this records what their own
          # dependencies resolved to for this run.
          "${RUNNER_TEMP}/scanners/bin/python" -m pip freeze

      # Created without pip and installed into from outside, so the
      # environment holds the package and its runtime dependencies and
      # nothing that only installs them.
      - name: Install ${{ matrix.install }} into a clean environment
        run: |
          python -m venv --without-pip "${RUNNER_TEMP}/target"
          if [ -n "${{ matrix.pins }}" ]; then
            python -m pip --python "${RUNNER_TEMP}/target/bin/python" install --quiet --require-hashes -r "${{ matrix.pins }}"
          fi
          python -m pip --python "${RUNNER_TEMP}/target/bin/python" install --quiet "${{ matrix.install }}"
          python -m pip --python "${RUNNER_TEMP}/target/bin/python" list

      - name: CycloneDX SBOM
        run: |
          mkdir -p sbom
          "${RUNNER_TEMP}/scanners/bin/cyclonedx-py" environment \
            --pyproject "${{ matrix.package }}/pyproject.toml" \
            --output-reproducible \
            --output-format JSON \
            -o "sbom/${{ matrix.artifact }}.cdx.json" \
            "${RUNNER_TEMP}/target/bin/python"
          python - "sbom/${{ matrix.artifact }}.cdx.json" <<'PY'
          import json, sys
          bom = json.load(open(sys.argv[1]))
          root = bom.get("metadata", {}).get("component", {})
          components = bom.get("components", [])
          print(bom["bomFormat"], bom["specVersion"], "for", root.get("name"), root.get("version"))
          print(len(components), "components:", ", ".join(f"{c.get('name')} {c.get('version')}" for c in components) or "none")
          PY

      # Before the audit, so a run whose audit fails still keeps its SBOM.
      - name: Upload the SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.artifact }}
          path: sbom/${{ matrix.artifact }}.cdx.json
          if-no-files-found: error

      # What is audited is the package's runtime dependency closure: what
      # pip freeze lists in the clean environment, less the package.
      # Without an extra, both packages declare no runtime dependency today,
      # so that closure is empty and a clean result would prove nothing; the
      # positive control first requires it to report a pin with published
      # advisories.
      - name: pip-audit, with the recorded dispositions
        run: |
          python -m pip install --quiet -r tools/release/requirements.txt
          python tools/release/check-vulnerability-dispositions.py --pip-audit-args >"${RUNNER_TEMP}/pip-audit-args"
          mapfile -t ignore <"${RUNNER_TEMP}/pip-audit-args"
          audit=("${RUNNER_TEMP}/scanners/bin/pip-audit" --progress-spinner off --no-deps --disable-pip)

          printf 'pip==25.0.1\n' >"${RUNNER_TEMP}/control.txt"
          status=0
          "${audit[@]}" -r "${RUNNER_TEMP}/control.txt" >"${RUNNER_TEMP}/control.out" 2>&1 || status=$?
          if [ "$status" -ne 1 ] || ! grep -Eq 'PYSEC-|GHSA-' "${RUNNER_TEMP}/control.out"; then
            cat "${RUNNER_TEMP}/control.out"
            echo "positive control failed (exit ${status}): pip-audit did not report pip 25.0.1's published advisories" >&2
            exit 1
          fi
          echo "positive control: pip-audit reports pip 25.0.1's published advisories"

          python -m pip --python "${RUNNER_TEMP}/target/bin/python" freeze >"${RUNNER_TEMP}/freeze.txt"
          python - "${{ matrix.package }}/pyproject.toml" "${RUNNER_TEMP}/freeze.txt" "${RUNNER_TEMP}/closure.txt" <<'PY'
          import pathlib, re, sys, tomllib
          def norm(name):
              return re.sub(r"[-_.]+", "-", name).lower()
          own = norm(tomllib.loads(pathlib.Path(sys.argv[1]).read_text())["project"]["name"])
          lines = [line.strip() for line in pathlib.Path(sys.argv[2]).read_text().splitlines() if line.strip()]
          closure = [line for line in lines if norm(re.split(r"[=<>!~ @;\[]", line)[0]) != own]
          if len(closure) == len(lines):
              sys.exit(f"{own} is not in the environment it was installed into")
          pathlib.Path(sys.argv[3]).write_text("".join(line + "\n" for line in closure))
          print(f"{own}: {len(closure)} third-party runtime dependencies")
          PY
          if [ -s "${RUNNER_TEMP}/closure.txt" ]; then
            "${audit[@]}" -r "${RUNNER_TEMP}/closure.txt" "${ignore[@]}"
          else
            echo "nothing to audit: the package has no third-party runtime dependency"
          fi

  speech-runtime-lock:
    name: SBOM and audit (speech runtime lock)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install the scanners in their own environment
        run: |
          python -m venv "${RUNNER_TEMP}/scanners"
          "${RUNNER_TEMP}/scanners/bin/python" -m pip install --quiet \
            "cyclonedx-bom==${CYCLONEDX_BOM_VERSION}" "pip-audit==${PIP_AUDIT_VERSION}"
          "${RUNNER_TEMP}/scanners/bin/python" -m pip freeze

      # The lock is read, never installed: its pins and digests are what the
      # packages are built from. The loader built from this tree is left out.
      - name: The lock as one requirements file
        run: |
          lock=packaging/speech-runtime/lock
          first_party="$(awk '!/^#/ && $2 == "tree" {print $1}' "${lock}/sources.txt" | paste -sd'|')"
          for file in "${lock}"/*.txt; do
            case "$(basename "${file}")" in index.txt|sources.txt|undeclared-licenses.txt) continue ;; esac
            cat "${file}"
          done | grep -Ev "^(${first_party})==" >"${RUNNER_TEMP}/speech-lock.txt"
          echo "$(wc -l <"${RUNNER_TEMP}/speech-lock.txt") third-party pins"
          [ -s "${RUNNER_TEMP}/speech-lock.txt" ]

      - name: CycloneDX SBOM
        run: |
          mkdir -p sbom
          "${RUNNER_TEMP}/scanners/bin/cyclonedx-py" requirements \
            --output-reproducible \
            --output-format JSON \
            -o sbom/tensorplate-speech-runtime.cdx.json \
            "${RUNNER_TEMP}/speech-lock.txt"
          python - sbom/tensorplate-speech-runtime.cdx.json "${RUNNER_TEMP}/speech-lock.txt" <<'PY'
          import json, sys
          components = json.load(open(sys.argv[1]))["components"]
          pins = [line for line in open(sys.argv[2]) if line.strip()]
          if len(components) != len(pins):
              sys.exit(f"{len(components)} components for {len(pins)} pins")
          unhashed = [c["name"] for c in components
                      if not any(r.get("hashes") for r in c.get("externalReferences", []))]
          if unhashed:
              sys.exit(f"components without a digest: {unhashed}")
          print(len(components), "components, each with its locked digest")
          PY

      - name: Upload the SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-tensorplate-speech-runtime
          path: sbom/tensorplate-speech-runtime.cdx.json
          if-no-files-found: error

      # Advisories are published against public versions, so a local version
      # label (the CUDA build of torch) is dropped for the audit. A pin that
      # is not on PyPI is reported as skipped, not as clean.
      - name: pip-audit, with the recorded dispositions
        run: |
          python -m pip install --quiet -r tools/release/requirements.txt
          python tools/release/check-vulnerability-dispositions.py --pip-audit-args >"${RUNNER_TEMP}/pip-audit-args"
          mapfile -t ignore <"${RUNNER_TEMP}/pip-audit-args"
          audit=("${RUNNER_TEMP}/scanners/bin/pip-audit" --progress-spinner off --no-deps --disable-pip)

          printf 'pip==25.0.1\n' >"${RUNNER_TEMP}/control.txt"
          status=0
          "${audit[@]}" -r "${RUNNER_TEMP}/control.txt" >"${RUNNER_TEMP}/control.out" 2>&1 || status=$?
          if [ "$status" -ne 1 ] || ! grep -Eq 'PYSEC-|GHSA-' "${RUNNER_TEMP}/control.out"; then
            cat "${RUNNER_TEMP}/control.out"
            echo "positive control failed (exit ${status}): pip-audit did not report pip 25.0.1's published advisories" >&2
            exit 1
          fi

          sed -E 's/^([^=]+==[^ +]+)\+[^ ]+/\1/' "${RUNNER_TEMP}/speech-lock.txt" >"${RUNNER_TEMP}/speech-audit.txt"
          "${audit[@]}" -r "${RUNNER_TEMP}/speech-audit.txt" "${ignore[@]}"

  native:
    name: SBOM and audit (serving worker native closure)
    runs-on: ubuntu-22.04
    # The release configuration's dependencies are restored from the cache
    # the dependency workflow keeps warm on develop; the bound is for a
    # pull request whose manifest change leaves that cache cold.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # A stalled mirror holds a connection open without failing; a response
      # timeout turns the stall into an error that a retry can recover.
      - name: Make apt fail fast and retry
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-tensorplate-resilience >/dev/null
          apt-config dump | grep -E '^Acquire::(Retries|http::Timeout)' || {
            echo 'apt did not accept the resilience drop-in' >&2; exit 1; }

      - name: Install the release profile's compilers
        shell: bash
        run: |
          set -Eeuo pipefail
          tools/ci/apt-get.sh update
          tools/ci/apt-get.sh install -y --no-install-recommends \
            ca-certificates \
            clang-15 \
            llvm-15 \
            ninja-build
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-15 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-15 100

      # Never saves: the dependency workflow is the one writer on develop.
      - name: Pinned vcpkg checkout and binary cache
        uses: ./.github/actions/release-vcpkg
        with:
          mode: build

      # Configure is what runs `vcpkg install`; nothing of this tree is compiled.
      - name: Configure the release profile
        shell: bash
        run: |
          set -Eeuo pipefail
          # shellcheck source=tools/release/amd64-build-profile.sh disable=SC1091
          . tools/release/amd64-build-profile.sh
          CC="$TP_AMD64_CC" CXX="$TP_AMD64_CXX" cmake -S . -B "${RUNNER_TEMP}/native" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTP_BUILD_TESTS=OFF \
            -DTP_BUILD_EXAMPLES=OFF \
            -DTP_ENABLE_SANITIZERS=OFF \
            "${TP_AMD64_CMAKE_ARGS[@]}"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: SPDX SBOM of the native closure, from the install tree
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p sbom
          python3 tools/release/native-sbom.py collect \
            --install-root "${RUNNER_TEMP}/native/vcpkg_installed" \
            --manifest vcpkg.json --feature streaming-grpc --triplet x64-linux \
            --cmake-cache "${RUNNER_TEMP}/native/CMakeCache.txt" \
            --archives "${RUNNER_TEMP}/vcpkg-archives" \
            --output sbom/tensorplate-serving-native-closure-x64-linux.spdx.json
          python3 tools/release/native-sbom.py check \
            --sbom sbom/tensorplate-serving-native-closure-x64-linux.spdx.json \
            --manifest vcpkg.json --feature streaming-grpc --triplet x64-linux
          python3 - sbom/tensorplate-serving-native-closure-x64-linux.spdx.json <<'PY'
          import json, sys
          doc = json.load(open(sys.argv[1]))
          for p in doc["packages"][1:]:
              cpes = [r["referenceLocator"] for r in p.get("externalRefs", []) if r["referenceType"] == "cpe23Type"]
              print(p["name"], p["versionInfo"], p["licenseConcluded"], cpes or p.get("comment"))
          PY

      # Before the scan, so a run whose scan fails still keeps its SBOM.
      - name: Upload the SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-tensorplate-serving-native-closure
          path: sbom/tensorplate-serving-native-closure-x64-linux.spdx.json
          if-no-files-found: error

      - name: Install grype ${{ env.GRYPE_VERSION }}
        shell: bash
        run: |
          set -Eeuo pipefail
          name="grype_${GRYPE_VERSION}_linux_amd64"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${name}.tar.gz" \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/${name}.tar.gz"
          printf '%s  %s\n' "${GRYPE_SHA256}" "${RUNNER_TEMP}/${name}.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/${name}.tar.gz" -C "${RUNNER_TEMP}/bin" grype
          echo "${RUNNER_TEMP}/bin" >>"$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/grype" version

      # The closure may well be clean, and a clean result would prove
      # nothing about the scanner; the positive control first requires it
      # to report a release with published advisories, matched by the same
      # kind of CPE reference the real document carries. grype exits 2
      # when a match reaches --fail-on.
      - name: grype positive control
        shell: bash
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          set -Eeuo pipefail
          control=test/release/fixtures/native-sbom/positive-control.spdx.json
          status=0
          grype "sbom:${control}" --fail-on negligible -o json="${RUNNER_TEMP}/control.json" -q || status=$?
          found="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["matches"]))' "${RUNNER_TEMP}/control.json")"
          if [ "$status" -ne 2 ] || [ "$found" -eq 0 ]; then
            echo "positive control failed (exit ${status}, ${found} matches): grype did not report OpenSSL 3.0.0's published advisories from a CPE reference" >&2
            exit 1
          fi
          echo "positive control: grype reports ${found} advisories against OpenSSL 3.0.0 by CPE"

      - name: Install release tooling requirements
        run: python3 -m pip install --quiet -r tools/release/requirements.txt

      # Judged on the report, not on a severity threshold: an advisory NVD
      # has not scored yet is a match of unknown severity, below any
      # threshold. Any match that no disposition ignores fails.
      - name: grype, with the recorded dispositions
        shell: bash
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          set -Eeuo pipefail
          python3 tools/release/check-vulnerability-dispositions.py --grype-ignore >"${RUNNER_TEMP}/grype.yaml"
          cat "${RUNNER_TEMP}/grype.yaml"
          status=0
          grype --config "${RUNNER_TEMP}/grype.yaml" \
            "sbom:sbom/tensorplate-serving-native-closure-x64-linux.spdx.json" \
            --by-cve --show-suppressed \
            -o table -o json="${RUNNER_TEMP}/native-scan.json" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "grype did not complete the scan (exit ${status})" >&2
            exit 1
          fi
          python3 - "${RUNNER_TEMP}/native-scan.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          matches = report["matches"]
          for match in matches:
              print(match["vulnerability"]["id"], match["vulnerability"].get("severity"),
                    match["artifact"]["name"], match["artifact"]["version"], file=sys.stderr)
          print(len(matches), "undispositioned,", len(report.get("ignoredMatches", [])), "dispositioned")
          if matches:
              sys.exit("advisories against the native closure with no disposition; fix the pin or "
                       "record one in tools/release/vulnerability-dispositions.json")
          PY

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grype-tensorplate-serving-native-closure
          path: ${{ runner.temp }}/native-scan.json
          if-no-files-found: ignore
