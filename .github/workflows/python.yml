name: Python

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_ROOT_USER_ACTION: ignore
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  python:
    name: ruff + mypy + pytest (${{ matrix.package }}, py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - backends/python_pytorch
          - sdk/python
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.package }}/pyproject.toml

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src tests

      - name: pytest
        run: pytest -q

  sdk-python-vision:
    name: vision pytest (sdk/python, py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install package with dev and vision dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vision]"

      - name: pytest vision examples
        env:
          TENSORPLATE_REQUIRE_VISION_EXTRAS: '1'
        run: pytest -q tests/test_examples.py::test_yolo_detect_against_fixture
