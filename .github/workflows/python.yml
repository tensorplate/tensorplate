name: Python

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_ROOT_USER_ACTION: ignore
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  python:
    name: ruff + mypy + pytest (${{ matrix.package }}, py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: backends/python_pytorch
            python-version: '3.10'
          - package: backends/python_pytorch
            python-version: '3.12'
          - package: backends/python_pytorch
            python-version: '3.14'
          - package: sdk/python
            python-version: '3.10'
          - package: sdk/python
            python-version: '3.12'
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.package }}/pyproject.toml

      # A package that pins its build environment builds from those hashed
      # pins: sdk/python, whose build generates the stream schema's modules.
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          build_pins=()
          if [ -f constraints/build.txt ]; then
            build_pins=(--build-constraint "${PWD}/constraints/build.txt")
          fi
          pip install "${build_pins[@]}" -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src tests

      - name: pytest
        run: pytest -q

  python-required-status:
    name: ruff + mypy + pytest (${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    needs: [python, sdk-python-speech]
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Require full Python package matrix success
        run: |
          if [ "${{ needs.python.result }}" != "success" ]; then
            echo "Python package matrix result: ${{ needs.python.result }}"
            exit 1
          fi
          if [ "${{ needs.sdk-python-speech.result }}" != "success" ]; then
            echo "Speech extra matrix result: ${{ needs.sdk-python-speech.result }}"
            exit 1
          fi
          echo "Python package matrix passed."

  sdk-python-vision:
    name: vision pytest (sdk/python, py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install package with dev and vision dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --build-constraint "${PWD}/constraints/build.txt" -e ".[dev,vision]"

      - name: pytest vision examples
        env:
          TENSORPLATE_REQUIRE_VISION_EXTRAS: '1'
        run: pytest -q tests/test_examples.py::test_yolo_detect_against_fixture

  sdk-python-speech:
    name: speech extra pytest (sdk/python, py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            sdk/python/pyproject.toml
            sdk/python/constraints/speech.txt
            sdk/python/constraints/build.txt

      # The pins go in first and alone: a hashed file puts pip in
      # hash-required mode, which refuses the local package. The build pins
      # add the generator, which the schema drift test and the build test
      # run. The package is installed as a wheel built here, not in place,
      # so the tests read the modules a wheel carries.
      - name: Install the hashed pins, then a wheel of the package with dev and speech dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r constraints/speech.txt
          pip install --require-hashes -r constraints/build.txt
          pip wheel --no-deps --build-constraint "${PWD}/constraints/build.txt" \
            --wheel-dir "${RUNNER_TEMP}/sdk-wheel" .
          pip install "$(echo "${RUNNER_TEMP}"/sdk-wheel/tensorplate_python-*.whl)[dev,speech]"

      # The streaming client's tests come last: they start no process, and
      # nothing forks once their gRPC channels have run.
      - name: pytest the dependency guard, the pins, the stream modules, the build and the streaming client
        env:
          TENSORPLATE_REQUIRE_SPEECH_EXTRAS: '1'
        run: >-
          pytest -q tests/test_import_safety.py tests/test_speech_import.py
          tests/test_stream_modules.py tests/test_distribution.py tests/test_e2e_agent_stream.py
          tests/test_streaming_server.py tests/test_streaming_client.py
          tests/test_streaming_tts.py tests/test_streaming_discovery.py
