name: Python

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_ROOT_USER_ACTION: ignore
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  python:
    name: ruff + mypy + pytest (${{ matrix.package }}, py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: backends/python_pytorch
            python-version: '3.10'
          - package: backends/python_pytorch
            python-version: '3.12'
          - package: backends/python_pytorch
            python-version: '3.14'
          - package: sdk/python
            python-version: '3.10'
          - package: sdk/python
            python-version: '3.12'
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.package }}/pyproject.toml

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src tests

      - name: pytest
        run: pytest -q

  python-required-status:
    name: ruff + mypy + pytest (${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    needs: python
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Require full Python package matrix success
        run: |
          if [ "${{ needs.python.result }}" != "success" ]; then
            echo "Python package matrix result: ${{ needs.python.result }}"
            exit 1
          fi
          echo "Python package matrix passed."

  sdk-python-vision:
    name: vision pytest (sdk/python, py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install package with dev and vision dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vision]"

      - name: pytest vision examples
        env:
          TENSORPLATE_REQUIRE_VISION_EXTRAS: '1'
        run: pytest -q tests/test_examples.py::test_yolo_detect_against_fixture

  sdk-python-speech:
    name: speech extra pytest (sdk/python, py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            sdk/python/pyproject.toml
            sdk/python/constraints/speech.txt

      # The pins go in first and alone: a hashed file puts pip in
      # hash-required mode, which refuses the local package.
      - name: Install the hashed speech pins, then the package with dev and speech dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r constraints/speech.txt
          pip install -e ".[dev,speech]"

      - name: pytest speech import guard and pins
        env:
          TENSORPLATE_REQUIRE_SPEECH_EXTRAS: '1'
        run: pytest -q tests/test_import_safety.py tests/test_speech_import.py
